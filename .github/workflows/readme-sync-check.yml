name: README Sync Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  readme-sync-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify README Sync
        run: npm run readme:sync:check
