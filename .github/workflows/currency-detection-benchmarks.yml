name: Currency Detection Benchmarks

on:
  pull_request:
    paths:
      - "packages/currency-detection/**"
      - "apps/extension/utils/**"
      - "apps/extension/tests/unit/parse-currency*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/currency-detection-benchmarks.yml"
  push:
    branches:
      - main
    paths:
      - "packages/currency-detection/**"
      - "apps/extension/utils/**"
      - "apps/extension/tests/unit/parse-currency*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/currency-detection-benchmarks.yml"

jobs:
  benchmark:
    name: Benchmark And Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Baseline Snapshot
        run: npm run currency-detection:baseline

      - name: Run Standalone Package Tests
        run: npm run currency-detection:test

      - name: Run Extension Unit Regression Guard
        run: npm run test:frontend

      - name: Run Benchmarks
        run: npm run currency-detection:bench

      - name: Compare Benchmarks (Info-Only)
        run: npm run currency-detection:bench:compare

      - name: Publish Benchmark Summary
        run: |
          cat packages/currency-detection/benchmarks/results/latest.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat packages/currency-detection/benchmarks/results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: currency-detection-benchmarks
          path: |
            packages/currency-detection/benchmarks/results/latest.json
            packages/currency-detection/benchmarks/results/latest.md
            packages/currency-detection/benchmarks/results/comparison.md
            packages/currency-detection/test/fixtures/parity-cases.json
            packages/currency-detection/test/fixtures/legacy-snapshot.json
