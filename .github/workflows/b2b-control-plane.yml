name: B2B Control Plane

on:
  pull_request:
    paths:
      - "apps/control-plane-api/**"
      - "apps/dashboard/**"
      - "apps/website/b2b-runtime/**"
      - "packages/b2b-plugin-sdk/**"
      - ".github/workflows/b2b-control-plane.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "apps/control-plane-api/**"
      - "apps/dashboard/**"
      - "apps/website/b2b-runtime/**"
      - "packages/b2b-plugin-sdk/**"
      - ".github/workflows/b2b-control-plane.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run control-plane tests
        run: npm run test:control-plane

      - name: Run B2B runtime tests
        run: npm run test:b2b-runtime

      - name: Run plugin SDK tests
        run: npm run test:b2b-plugin-sdk

      - name: Deterministic check (ACME pre plugin)
        run: npm run b2b-plugin:check:acme-pre

      - name: Build website and dashboard
        run: |
          npm run build:website
          npm run build:dashboard
