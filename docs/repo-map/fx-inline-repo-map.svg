<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">FX Inline repository structure map</title>
  <desc id="desc">A graphical map of the FX Inline monorepo showing the extension, shared inline runtime, currency detection parser, admin settings system, website, build and release pipeline, plus complexity and improvement callouts.</desc>
  <defs>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="titleFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#1f4f8f"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <style>
      .panel {
        fill: rgba(255, 255, 255, 0.88);
        stroke-width: 0;
      }
      .panel-title {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 0;
        fill: #0f172a;
      }
      .panel-line {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0;
        fill: #334155;
      }
      .small {
        font-size: 15px;
        font-weight: 700;
        fill: #334155;
      }
      .pill {
        fill: rgba(255, 255, 255, 0.9);
        stroke: rgba(15, 23, 42, 0.18);
        stroke-width: 1.2;
      }
      .pill-text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        font-weight: 800;
        fill: #0f172a;
        letter-spacing: 0;
      }
      .callout {
        fill: rgba(255, 247, 237, 0.94);
        stroke: #fb6f57;
        stroke-width: 2;
      }
      .callout-title {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 17px;
        font-weight: 900;
        fill: #b42318;
        letter-spacing: 0;
      }
      .callout-line {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #4b1d16;
        letter-spacing: 0;
      }
      .route {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.74;
      }
    </style>
  </defs>

  <image href="fx-inline-repo-map-background.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>

  <g filter="url(#textShadow)">
    <rect x="612" y="378" width="448" height="82" rx="8" fill="rgba(255, 255, 255, 0.9)" stroke="rgba(15, 23, 42, 0.16)" stroke-width="1.4"/>
    <text x="836" y="410" text-anchor="middle" class="panel-title" fill="url(#titleFill)">FX Inline Repo Map</text>
    <text x="836" y="437" text-anchor="middle" class="panel-line">signal - worker - runtime - DOM</text>
  </g>

  <g filter="url(#textShadow)">
    <rect class="panel" x="75" y="40" width="420" height="100" rx="8"/>
    <text x="102" y="70" class="panel-title">apps/extension</text>
    <text x="102" y="98" class="panel-line">WXT + Preact browser app</text>
    <text x="102" y="124" class="panel-line">popup, options, welcome, background</text>

    <rect class="panel" x="623" y="40" width="427" height="100" rx="8"/>
    <text x="650" y="70" class="panel-title">packages/inline-runtime</text>
    <text x="650" y="98" class="panel-line">DOM conversion controller + core pass</text>
    <text x="650" y="124" class="panel-line">mutation roots, partial passes, plugins</text>

    <rect class="panel" x="1183" y="40" width="430" height="100" rx="8"/>
    <text x="1210" y="70" class="panel-title">packages/currency-detection</text>
    <text x="1210" y="98" class="panel-line">dependency-free parser core</text>
    <text x="1210" y="124" class="panel-line">symbols, ISO codes, locales, benchmarks</text>

    <rect class="panel" x="75" y="490" width="420" height="100" rx="8"/>
    <text x="102" y="520" class="panel-title">apps/admin + apps/backend</text>
    <text x="102" y="548" class="panel-line">React workbench + Nest API</text>
    <text x="102" y="574" class="panel-line">SQLite settings store exports manifest</text>

    <rect class="panel" x="592" y="812" width="488" height="98" rx="8"/>
    <text x="836" y="842" text-anchor="middle" class="panel-title">apps/website</text>
    <text x="836" y="870" text-anchor="middle" class="panel-line">marketing site + parser playground</text>
    <text x="836" y="896" text-anchor="middle" class="panel-line">useful demo surface for detection behavior</text>

    <rect class="panel" x="1183" y="490" width="430" height="100" rx="8"/>
    <text x="1210" y="520" class="panel-title">scripts + .github/workflows</text>
    <text x="1210" y="548" class="panel-line">admin export - assets - WXT build</text>
    <text x="1210" y="574" class="panel-line">assertions, release zips, store publish</text>
  </g>

  <g>
    <path class="route" stroke="#2563eb" d="M500 250 C575 260 618 297 670 368"/>
    <path class="route" stroke="#0f766e" d="M836 145 C836 222 836 286 836 376"/>
    <path class="route" stroke="#d97706" d="M1055 286 C1112 255 1165 244 1225 238"/>
    <path class="route" stroke="#2f855a" d="M498 545 C574 523 624 474 682 444"/>
    <path class="route" stroke="#334155" d="M1058 440 C1128 467 1176 510 1218 548"/>
    <path class="route" stroke="#7c3aed" d="M836 462 C836 562 836 698 836 810"/>
  </g>

  <g filter="url(#textShadow)">
    <rect class="pill" x="456" y="296" width="310" height="34" rx="8"/>
    <text x="611" y="318" text-anchor="middle" class="pill-text">contentActivation - content-worker</text>

    <rect class="pill" x="703" y="196" width="266" height="34" rx="8"/>
    <text x="836" y="218" text-anchor="middle" class="pill-text">createInlineRuntime adapter</text>

    <rect class="pill" x="1014" y="247" width="262" height="34" rx="8"/>
    <text x="1145" y="269" text-anchor="middle" class="pill-text">extractCurrencyTextMatches</text>

    <rect class="pill" x="481" y="596" width="268" height="34" rx="8"/>
    <text x="615" y="618" text-anchor="middle" class="pill-text">generated settings manifest</text>

    <rect class="pill" x="1028" y="598" width="252" height="34" rx="8"/>
    <text x="1154" y="620" text-anchor="middle" class="pill-text">manifest, CSP, chunks, release</text>

    <rect class="pill" x="700" y="740" width="272" height="34" rx="8"/>
    <text x="836" y="762" text-anchor="middle" class="pill-text">playground validates parser behavior</text>
  </g>

  <g filter="url(#textShadow)">
    <rect class="callout" x="366" y="350" width="306" height="86" rx="8"/>
    <text x="395" y="377" class="callout-title">Complex handoff</text>
    <text x="395" y="401" class="callout-line">Activation crosses five layers:</text>
    <text x="395" y="422" class="callout-line">shim, worker, runtime adapter.</text>

    <rect class="callout" x="1020" y="350" width="312" height="86" rx="8"/>
    <text x="1041" y="377" class="callout-title">Policy hub</text>
    <text x="1041" y="401" class="callout-line">wxt.config owns CSP, chunks, release</text>
    <text x="1041" y="422" class="callout-line">versioning, Firefox hardening.</text>

    <rect class="callout" x="1034" y="648" width="326" height="96" rx="8"/>
    <text x="1055" y="675" class="callout-title">Provider duplication</text>
    <text x="1055" y="699" class="callout-line">Rate-provider parsing exists in</text>
    <text x="1055" y="720" class="callout-line">extension utils and inline-runtime</text>
    <text x="1055" y="741" class="callout-line">package code.</text>

    <rect class="callout" x="318" y="660" width="334" height="86" rx="8"/>
    <text x="339" y="687" class="callout-title">Generated settings ownership</text>
    <text x="339" y="711" class="callout-line">Admin export is build-critical; document</text>
    <text x="339" y="732" class="callout-line">schema, owner, and regeneration triggers.</text>

    <rect class="callout" x="690" y="628" width="306" height="96" rx="8"/>
    <text x="713" y="655" class="callout-title">Parser and plugin growth</text>
    <text x="713" y="679" class="callout-line">New parser/site rules need fixture</text>
    <text x="713" y="700" class="callout-line">pages, perf budgets, and plugin</text>
    <text x="713" y="721" class="callout-line">contract tests.</text>
  </g>

  <g filter="url(#textShadow)">
    <rect x="42" y="872" width="364" height="45" rx="8" fill="rgba(255,255,255,0.86)" stroke="rgba(15,23,42,0.16)" stroke-width="1"/>
    <text x="62" y="900" class="small">Map source: current repo inspection plus imagegen background.</text>
  </g>
</svg>
